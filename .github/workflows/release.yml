name: release

# One automated build on the latest macOS: cross-build the whole 10.9 product
# (x86_64 @ 10.9 userland + a real VoodooInputMavericks.kext built against a fetched
# MacOSX10.9 SDK), gate it, package it, and publish a GitHub Release on v* tags.
#
# AUTHENTICITY / CORRECTNESS of the cross-built kext rests on two things, no old
# Xcode required:
#   1. the SDK is pinned by SHA-256 in shipyard's fetch_sdk.sh (integrity;
#      from ModernMavericks/shipyard, consumed at @v1), and
#   2. the equivalence gate (cmake/characterize_build.sh compare) proves the
#      cross-built kext is identical -- in undefined+defined external symbol sets,
#      KPI deps, and arch -- to the trusted native 10.9.5 build committed in
#      dist/characterization/. A swapped/tampered SDK yields a different kext and
#      fails this gate.
#
# RELEASE INVARIANT: the single `publish` job is the ONLY thing that writes to
# GitHub Releases and it `needs` the build job, so any build/gate failure skips
# publishing entirely -- never a partial release.

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]          # PR build is the status check Renovate automerge waits on
  workflow_dispatch:        # manual runs produce an artifact, not a release

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # shipyard installs itself via its own action. It self-registers in the per-user CMake package
      # registry (find_package(MavericksShipyard), no CMAKE_PREFIX_PATH downstream) and exports
      # $SHIPYARD_SCRIPTS, the installed scripts dir every later step uses -- never a hard-coded
      # $HOME/.local/share/cmake/<package>/scripts path, which is exactly what broke when the package
      # was renamed from MavericksSharedCMake. @v1 like every sibling: Renovate's github-actions
      # manager tracks the moving major tag.
      - name: Install mavericks-shipyard
        uses: ModernMavericks/shipyard/.github/actions/install@v1

      # The SDK cache key is the content of the script that pins the SDK: its URL, its SHA-256 and the
      # extract-time stub conversion all live in fetch_sdk.sh, so a change to any of them invalidates
      # the cache, and nothing else does. (Keying on what @v1 resolves to would miss nothing either,
      # but shipyard cuts a release on every push to its main, so that key would rarely hit.)
      - name: Key the SDK cache on shipyard's SDK pin
        id: sdkkey
        run: |
          set -eu
          [ -f "$SHIPYARD_SCRIPTS/fetch_sdk.sh" ] || { echo "::error::no fetch_sdk.sh under SHIPYARD_SCRIPTS='$SHIPYARD_SCRIPTS' (install@v1 exports it)"; exit 1; }
          sum="$(shasum -a 256 "$SHIPYARD_SCRIPTS/fetch_sdk.sh" | cut -d' ' -f1)"
          echo "sum=$sum" >> "$GITHUB_OUTPUT"

      - name: Determine version (from CMake MAVERICKS_VERSION — single source of truth)
        id: ver
        run: |
          VER=$(grep -m1 'set(MAVERICKS_VERSION' CMakeLists.txt | sed -E 's/.*"([^"]+)".*/\1/')
          [ -n "$VER" ] || { echo "::error::could not read MAVERICKS_VERSION from CMakeLists.txt"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          # On a tag build, enforce that the tag matches the CMake version so the
          # release name and the pkg version can never drift.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$VER" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != v$VER (CMakeLists MAVERICKS_VERSION); keep them in sync"
            exit 1
          fi
          # Release-notes gate: a tagged release MUST ship non-empty notes -- they become the appcast
          # <description> the updater shows. Fail fast here, before the long build (also enforced locally
          # by .githooks/pre-push).
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ ! -s "docs/release-notes/v$VER.md" ]; then
            echo "::error::missing/empty docs/release-notes/v$VER.md (author the release notes for the tag)"
            exit 1
          fi

      - name: Ensure Rosetta (x86_64 @ 10.9 tests run under it)
        run: softwareupdate --install-rosetta --agree-to-license || true

      # Persist the fetched SDK across runs so releases don't depend on the phracker
      # archive being up every time. Keyed on fetch_sdk.sh's content (step above), so a change to the
      # SDK pin auto-invalidates the cache.
      - name: Cache the MacOSX10.9 SDK
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.mt2-sdk-cache
          key: macosx10.9-sdk-${{ steps.sdkkey.outputs.sum }}

      - name: Fetch + checksum-verify the MacOSX10.9 SDK
        id: sdk
        env:
          MAVERICKS_SDK_CACHE: ${{ github.workspace }}/.mt2-sdk-cache
        # Two statements, not echo "path=$(...)": inside an argument, a failing command substitution is
        # invisible -- echo succeeds, the step goes green with path= empty, and the failure surfaces
        # later as a confusing configure/kext error. That is how this step hid the package rename.
        run: |
          set -eu
          sdk="$(sh "$SHIPYARD_SCRIPTS/fetch_sdk.sh")" \
            || { echo "::error::fetch_sdk.sh failed (see above) -- no MacOSX10.9 SDK to cross-build the kext"; exit 1; }
          [ -d "$sdk/usr/lib" ] || { echo "::error::fetch_sdk.sh printed '$sdk', which is not an SDK root"; exit 1; }
          echo "path=$sdk" >> "$GITHUB_OUTPUT"

      # NB (shared-cmake refactor, now shipyard): Sparkle + ed25519 are no longer fetched here. mavericks_add_updater_app()
      # self-fetches the Sparkle framework at configure time (cached under ~/Library/Caches), and the release
      # signing step below uses scripts/sign_and_appcast.sh, which fetches the prebuilt ed25519-sign via gh.
      # Only the 10.9 SDK (for the kext cross-build) still needs an explicit fetch + -D pass.

      - name: Configure + build (x86_64 @ 10.9 userland + kext + updater)
        run: |
          cmake -S . -B build -DMT2_MACOSX_10_9_SDK="${{ steps.sdk.outputs.path }}"
          cmake --build build
          echo "userland slice:"; lipo -info build/sbin/mt2_reenumerate
          echo "kext:"; file build/VoodooInputMavericks.kext/Contents/MacOS/VoodooInputMavericks

      - name: Kext cross-build equivalence gate (vs native 10.9 reference, fail-closed)
        run: sh cmake/characterize_build.sh compare dist/characterization build

      - name: Unit tests (Rosetta)
        # Exclude test_re_bats: the `re` toolkit suite reverse-engineers 10.9 system
        # frameworks (MultitouchSupport / MTDeviceCreateListForDriverType, symbolicated
        # framework binaries) that don't exist on the macos-26 runner. It runs on the
        # 10.9 dev box; here we validate the cross-built product's logic + portable tooling.
        run: ctest --test-dir build --output-on-failure -E '^test_re_bats$'

      - name: Build .pkg (10.9.5 install floor)
        run: |
          cmake --build build --target pkg   # version derives from CMake MAVERICKS_VERSION
          echo "floor check:"; pkgutil --expand "build/voodooinputmavericks-${{ steps.ver.outputs.version }}.pkg" /tmp/pkgx
          grep -o 'os-version min="[0-9.]*"' /tmp/pkgx/Distribution

      - name: Sign the .pkg + generate the Sparkle appcast
        if: github.ref_type == 'tag'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}   # sign_and_appcast.sh fetches the prebuilt ed25519-sign via gh
        run: |
          set -eu
          VER="${{ steps.ver.outputs.version }}"
          PKG="build/voodooinputmavericks-$VER.pkg"
          # printenv, not [ -n "$SPARKLE_PRIVATE_KEY" ]: the shell never expands the key, so no trace
          # (set -x, a debug re-run) can print it. grep -q . fails on unset and empty alike.
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/voodooinputmavericks-$VER.pkg"
          # shipyard's signer (scripts/sign_and_appcast.sh) fetches the prebuilt ed25519-sign and hands it
          # the key on STDIN, via `printenv SPARKLE_PRIVATE_KEY | ed25519-sign -f - PKG` inside the
          # script: this step never expands the key into a command line or a trace. It then runs
          # assert_update_trusted.sh, which verifies the signature against the SUPublicEDKey of the
          # updater ALREADY INSTALLED -- read from the live release's pkg via the live appcast, not from
          # this repo -- so a key installed clients would reject fails HERE, not on users' machines, and
          # no appcast is written. docs/release-notes/vVER.md is inlined as the appcast <description>.
          [ -f "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" ] || { echo "::error::no sign_and_appcast.sh under SHIPYARD_SCRIPTS='$SHIPYARD_SCRIPTS'"; exit 1; }
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" \
            --channel-title "Mavericks Trackpad 2" --version "$VER" --pkg-url "$URL" \
            --notes-file "docs/release-notes/v$VER.md" --pkg "$PKG" --min-os 10.9.5 > build/appcast.xml
          echo "=== appcast.xml ==="; cat build/appcast.xml

      - name: Upload build artifact (always)
        uses: actions/upload-artifact@v7
        with:
          name: voodooinputmavericks-pkg
          if-no-files-found: warn   # appcast.xml is tag-only; the .pkg always exists
          path: |
            build/voodooinputmavericks-${{ steps.ver.outputs.version }}.pkg
            build/appcast.xml

  # All-or-nothing publish: the ONLY job that writes to GitHub Releases, gated on a
  # successful build. A forgotten `needs` entry is the classic way to ship a partial
  # release -- keep this list complete as build jobs are added.
  publish:
    needs: [build-macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      # Check out the repo so docs/release-notes/vX.Y.Z.md exists for body_path below (the
      # download-artifact step only brings the .pkg + appcast, not the source tree).
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          # Human-readable release body = the same notes we ship in the appcast. GitHub renders
          # Markdown natively, so the raw .md is correct here (no HTML). ref_name on a tag push is
          # vX.Y.Z, matching the file name; this job only runs on tags (if: github.ref_type=='tag').
          body_path: docs/release-notes/${{ github.ref_name }}.md
          # Pre-release ONLY if the tag has a -suffix (e.g. v0.2.0-beta1). A plain v0.x is now a FULL
          # release so GitHub's /releases/latest/ resolves to it -- which is what the updater's
          # SUFeedURL (/releases/latest/download/appcast.xml) depends on. (Dropped the old "v0.x =>
          # prerelease" rule, which hid every 0.x release from /latest/ and broke the feed.)
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/voodooinputmavericks-*.pkg
            dist/appcast.xml
