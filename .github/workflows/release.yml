name: release

# One automated build on the latest macOS: cross-build the whole 10.9 product
# (x86_64 @ 10.9 userland + a real VoodooInputMavericks.kext built against a fetched
# MacOSX10.9 SDK), gate it, package it, and -- only when asked -- publish it.
#
# RELEASE MODEL: deliberate publish (the family's "publishes only from a tag or a
# dispatch" column, minus the tag). Entry points:
#   - pull_request to main : build + gate. The status check Renovate automerge waits on.
#   - push to main         : build + gate, never a release.
#   - workflow_dispatch    : with release=true, from main, publish v<MAVERICKS_VERSION>;
#                            without it, build an artifact only.
# The version is this repo's own semver, hand-bumped as MAVERICKS_VERSION in CMakeLists.txt
# (scripts/derive-upstream-version.sh reads it); the tag is v<that>, as for every release
# since v0.1.0. So cutting a release is: bump MAVERICKS_VERSION, optionally commit
# release-notes/v<version>.md (hand-authored prose is optional -- shipyard's release-notes.sh
# generates the rest), push main, dispatch with release=true.
#
# There is no tag trigger any more. shipyard's publish-release.yml mints the tag itself at
# the dispatched commit, and refuses a tag that already exists (two runs racing one
# version must rebuild, never relabel). A hand-pushed v* tag therefore cannot publish
# anything -- it would only make the dispatch for that version refuse -- so
# .githooks/pre-push refuses to push one.
#
# AUTHENTICITY / CORRECTNESS of the cross-built kext rests on two things, no old
# Xcode required:
#   1. the SDK is pinned by SHA-256 in shipyard's fetch_sdk.sh (integrity;
#      from ModernMavericks/shipyard, consumed at @v1), and
#   2. the equivalence gate (cmake/characterize_build.sh compare) proves the
#      cross-built kext is identical -- in undefined+defined external symbol sets,
#      KPI deps, and arch -- to the trusted native 10.9.5 build committed in
#      dist/characterization/. A swapped/tampered SDK yields a different kext and
#      fails this gate.
#
# RELEASE INVARIANT: the single `publish` job is the ONLY thing that writes to
# GitHub Releases, and it `needs` both the build job and the signing-key scan, so any
# build/gate/scan failure skips publishing entirely -- never a partial release.

on:
  push:
    branches: [main]          # build + gate every change that lands; never publishes
  pull_request:
    branches: [main]          # PR build is the status check Renovate automerge waits on
  workflow_dispatch:
    inputs:
      release:
        # Not the family's local_release: that cuts a -mavericks.(N+1) repackage of someone else's
        # upstream. This repo is its own upstream with no -mavericks axis, so a dispatch publishes
        # exactly the committed MAVERICKS_VERSION, or nothing.
        description: "Publish v<MAVERICKS_VERSION> from main (off: build an artifact only)"
        type: boolean
        default: false

# Least privilege by default; only the publish job may write (to Releases).
permissions:
  contents: read

# Only a pull_request supersedes -- keyed per ref, so a force-push replaces its own predecessor.
# Everything else (a branch push, a workflow_dispatch) is keyed per RUN and is therefore alone in its
# group: never queued, never evicted, never cancelled. cancel-in-progress:false would not have been
# the protection it looks like: it protects the RUNNING job and not the QUEUED one -- GitHub keeps
# only the newest pending run per group and cancels the rest -- so a shared group silently discards
# a queued release (mavericks-golang lost one on 2026-09-09). Two dispatches of one version can now
# both build; publish-release.yml refuses the loser by name.
concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request'
                && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-macos:
    runs-on: macos-26
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          # release-notes.sh decides the release kind (first release vs. repackage) from visible
          # tags; a shallow checkout hides them and it refuses to run. Full history, always -- this
          # job is also the PR/push build, and a shallow clone there would fail differently on the
          # rare PR that touches release notes generation.
          fetch-depth: 0

      # shipyard installs itself via its own action: the pkg lands shipyard-cmake on PATH -- the only
      # cmake find_package(MavericksShipyard) accepts, and the one that supplies the prefix, so there
      # is still no CMAKE_PREFIX_PATH downstream. The action also exports $SHIPYARD_SCRIPTS, the
      # installed scripts dir every later step uses -- never a hard-coded
      # $HOME/.local/share/cmake/<package>/scripts path, which is exactly what broke when the package
      # was renamed from MavericksSharedCMake. @v1 like every sibling: Renovate's github-actions
      # manager tracks the moving major tag.
      - name: Install mavericks-shipyard
        uses: ModernMavericks/shipyard/.github/actions/install@v1

      # The SDK cache key is the content of the script that pins the SDK: its URL, its SHA-256 and the
      # extract-time stub conversion all live in fetch_sdk.sh, so a change to any of them invalidates
      # the cache, and nothing else does. (Keying on what @v1 resolves to would miss nothing either,
      # but shipyard cuts a release on every push to its main, so that key would rarely hit.)
      - name: Key the SDK cache on shipyard's SDK pin
        id: sdkkey
        run: |
          set -eu
          [ -f "$SHIPYARD_SCRIPTS/fetch_sdk.sh" ] || { echo "::error::no fetch_sdk.sh under SHIPYARD_SCRIPTS='$SHIPYARD_SCRIPTS' (install@v1 exports it)"; exit 1; }
          sum="$(shasum -a 256 "$SHIPYARD_SCRIPTS/fetch_sdk.sh" | cut -d' ' -f1)"
          echo "sum=$sum" >> "$GITHUB_OUTPUT"

      # Decide the whole release plan ONCE, before the long build: the version (MAVERICKS_VERSION, the
      # single source of truth the pkg name, pkgbuild --version and the updater's CFBundleVersion all
      # derive from), its tag, and whether this run publishes. Only a release=true dispatch from main
      # publishes; everything that would make publish-release.yml refuse later is refused HERE, with
      # the fix named, instead of after twenty minutes of building.
      - name: Determine version + release plan (from CMake MAVERICKS_VERSION)
        id: ver
        env:
          RELEASE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        run: |
          set -eu
          VER="$(sh scripts/derive-upstream-version.sh)"
          TAG="v$VER"
          publish=false
          if [ "$RELEASE_INPUT" = true ]; then
            [ "$GITHUB_REF" = refs/heads/main ] \
              || { echo "::error::a release is cut from main only; this dispatch ran on $GITHUB_REF"; exit 1; }
            # publish-release.yml has no prerelease flag, so a suffixed version would become
            # /releases/latest/ -- the updater's SUFeedURL -- and be offered to every installed client.
            case "$VER" in *-*)
              echo "::error::$VER carries a pre-release suffix; publishing it would make it the release every installed updater is offered"
              exit 1 ;;
            esac
            # The same three-way answer publish-release.yml uses: 0 = taken, 2 = free, else unknown.
            set +e
            git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1
            rc=$?
            set -e
            case "$rc" in
              0) echo "::error::$TAG is already released. Bump MAVERICKS_VERSION in CMakeLists.txt, optionally add release-notes/v<new>.md, push main, and dispatch again."
                 exit 1 ;;
              2) echo "$TAG is free" ;;
              *) echo "::error::could not read tags from origin (git ls-remote exit $rc); refusing to build a release blind"
                 exit 1 ;;
            esac
            # Release notes are generated below by shipyard's release-notes.sh; hand-authored prose
            # at release-notes/$TAG.md is optional, not required.
            publish=true
          fi
          {
            echo "version=$VER"
            echo "tag=$TAG"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "version=$VER tag=$TAG publish=$publish"

      - name: Ensure Rosetta (x86_64 @ 10.9 tests run under it)
        run: softwareupdate --install-rosetta --agree-to-license || true

      # Persist the fetched SDK across runs so releases don't depend on the phracker
      # archive being up every time. Keyed on fetch_sdk.sh's content (step above), so a change to the
      # SDK pin auto-invalidates the cache.
      - name: Cache the MacOSX10.9 SDK
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.mt2-sdk-cache
          key: macosx10.9-sdk-${{ steps.sdkkey.outputs.sum }}

      - name: Fetch + checksum-verify the MacOSX10.9 SDK
        id: sdk
        env:
          MAVERICKS_SDK_CACHE: ${{ github.workspace }}/.mt2-sdk-cache
        # Two statements, not echo "path=$(...)": inside an argument, a failing command substitution is
        # invisible -- echo succeeds, the step goes green with path= empty, and the failure surfaces
        # later as a confusing configure/kext error. That is how this step hid the package rename.
        run: |
          set -eu
          sdk="$(sh "$SHIPYARD_SCRIPTS/fetch_sdk.sh")" \
            || { echo "::error::fetch_sdk.sh failed (see above) -- no MacOSX10.9 SDK to cross-build the kext"; exit 1; }
          [ -d "$sdk/usr/lib" ] || { echo "::error::fetch_sdk.sh printed '$sdk', which is not an SDK root"; exit 1; }
          echo "path=$sdk" >> "$GITHUB_OUTPUT"

      # NB (shared-cmake refactor, now shipyard): Sparkle + ed25519 are no longer fetched here. mavericks_add_updater_app()
      # self-fetches the Sparkle framework at configure time (cached under ~/Library/Caches), and the release
      # signing step below uses scripts/sign_and_appcast.sh, which fetches the prebuilt ed25519-sign via gh.
      # Only the 10.9 SDK (for the kext cross-build) still needs an explicit fetch + -D pass.

      - name: Configure + build (x86_64 @ 10.9 userland + kext + updater)
        run: |
          shipyard-cmake -S . -B build -DMT2_MACOSX_10_9_SDK="${{ steps.sdk.outputs.path }}"
          shipyard-cmake --build build
          echo "userland slice:"; lipo -info build/sbin/mt2_reenumerate
          echo "kext:"; file build/VoodooInputMavericks.kext/Contents/MacOS/VoodooInputMavericks

      - name: Kext cross-build equivalence gate (vs native 10.9 reference, fail-closed)
        run: sh cmake/characterize_build.sh compare dist/characterization build

      - name: Unit tests (Rosetta)
        # Exclude test_re_bats: the `re` toolkit suite reverse-engineers 10.9 system
        # frameworks (MultitouchSupport / MTDeviceCreateListForDriverType, symbolicated
        # framework binaries) that don't exist on the macos-26 runner. It runs on the
        # 10.9 dev box; here we validate the cross-built product's logic + portable tooling.
        run: shipyard-ctest --test-dir build --output-on-failure -E '^test_re_bats$'

      - name: Build .pkg (10.9.5 install floor)
        run: |
          shipyard-cmake --build build --target pkg   # version derives from CMake MAVERICKS_VERSION
          echo "floor check:"; pkgutil --expand "build/voodooinputmavericks-${{ steps.ver.outputs.version }}.pkg" /tmp/pkgx
          grep -o 'os-version min="[0-9.]*"' /tmp/pkgx/Distribution

      # Generated once, straight into the artifact dir: this file becomes BOTH the appcast
      # <description> (inlined below) AND the GitHub Release body (publish-release.yml reads it
      # from the artifact, unmodified) -- the same bytes, read twice. release-notes.sh composes the
      # title itself and slots any hand-authored prose at release-notes/$TAG.md verbatim after it;
      # that file is now OPTIONAL (see release-notes/README.md) -- a release with none still ships,
      # with just the generated "What changed" + footer sections.
      - name: Generate the release notes
        if: steps.ver.outputs.publish == 'true'
        run: |
          set -eu
          [ -f "$SHIPYARD_SCRIPTS/release-notes.sh" ] || { echo "::error::no release-notes.sh under SHIPYARD_SCRIPTS='$SHIPYARD_SCRIPTS'"; exit 1; }
          # --tag/--version equal, as for every self-upstream repo (this repo has no separate "full
          # version" distinct from its tag; --version's only other job, golang's line disambiguation,
          # doesn't apply here): this both matches release-notes.sh's own contract and titles the
          # release "v0.5.4", the form every prior hand-authored heading used.
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" \
            --tag "${{ steps.ver.outputs.tag }}" --version "${{ steps.ver.outputs.tag }}" \
            --product "Mavericks Trackpad 2" --min-os 10.9.5 --out build/RELEASE_NOTES.md
          echo "=== RELEASE_NOTES.md ==="; cat build/RELEASE_NOTES.md

      - name: Sign the .pkg + generate the Sparkle appcast
        if: steps.ver.outputs.publish == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}   # sign_and_appcast.sh fetches the prebuilt ed25519-sign via gh
        run: |
          set -eu
          VER="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          PKG="build/voodooinputmavericks-$VER.pkg"
          # printenv, not [ -n "$SPARKLE_PRIVATE_KEY" ]: the shell never expands the key, so no trace
          # (set -x, a debug re-run) can print it. grep -q . fails on unset and empty alike.
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          # The enclosure names the asset publish-release.yml will attach under $TAG, the tag it mints.
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/voodooinputmavericks-$VER.pkg"
          # shipyard's signer (scripts/sign_and_appcast.sh) fetches the prebuilt ed25519-sign and hands it
          # the key on STDIN, via `printenv SPARKLE_PRIVATE_KEY | ed25519-sign -f - PKG` inside the
          # script: this step never expands the key into a command line or a trace. It then runs
          # assert_update_trusted.sh, which verifies the signature against the SUPublicEDKey of the
          # updater ALREADY INSTALLED -- read from the live release's pkg via the live appcast, not from
          # this repo -- so a key installed clients would reject fails HERE, not on users' machines, and
          # no appcast is written. build/RELEASE_NOTES.md (generated above) is inlined as the appcast
          # <description> -- the very file that also becomes the GitHub Release body.
          [ -f "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" ] || { echo "::error::no sign_and_appcast.sh under SHIPYARD_SCRIPTS='$SHIPYARD_SCRIPTS'"; exit 1; }
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" \
            --channel-title "Mavericks Trackpad 2" --version "$VER" --pkg-url "$URL" \
            --notes-file "build/RELEASE_NOTES.md" --pkg "$PKG" --min-os 10.9.5 > build/appcast.xml
          echo "=== appcast.xml ==="; cat build/appcast.xml

      # publish-release.yml attaches EVERY file in this artifact (bar RELEASE_NOTES.md) as a release
      # asset, so it holds exactly the pkg, and on a publishing run the appcast + notes -- nothing else.
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: voodooinputmavericks-pkg
          if-no-files-found: warn   # the .pkg always exists; appcast.xml + RELEASE_NOTES.md only when publishing
          path: |
            build/voodooinputmavericks-${{ steps.ver.outputs.version }}.pkg
            build/appcast.xml
            build/RELEASE_NOTES.md

  # Before anything is published: no log of this run, and no file about to be released, carries a
  # piece of the signing key. publish-release.yml looks for this job's record on any signed release;
  # it cannot run the scan itself (reading job logs needs actions: read, which a called workflow may
  # not ask for). always(): a build that fails AFTER signing has logs written while the key was in
  # use, and they are just as public -- so they are scanned too.
  scan:
    needs: [build-macos]
    if: always() && (needs.build-macos.outputs.publish == 'true')
    permissions:
      actions: read     # this run's job logs
      contents: read
    uses: ModernMavericks/shipyard/.github/workflows/scan-for-key.yml@v1
    with:
      artifact: voodooinputmavericks-pkg
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  # All-or-nothing publish through the family's one publisher: it regenerates SHA256SUMS, uses
  # RELEASE_NOTES.md from the artifact as the Release body (failing if it is missing or empty), refuses
  # an already-taken tag, and mints the tag at this run's commit (a tag pushed with GITHUB_TOKEN would
  # trigger nothing, so the publisher must mint it inline). `version` IS the tag name: v<version>, the
  # shape every release of this repo has had. A forgotten `needs` entry is the classic way to ship a
  # partial release -- keep this list complete as build jobs are added.
  publish:
    needs: [build-macos, scan]
    if: needs.build-macos.outputs.publish == 'true'
    permissions:
      contents: write
    uses: ModernMavericks/shipyard/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.build-macos.outputs.tag }}
      artifact: voodooinputmavericks-pkg
